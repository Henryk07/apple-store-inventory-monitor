name: CI

on:
  # 刻意写 branches 而不是留空的 `push:`：留空时推 tag 也会触发，
  # 于是每打一个 v* 标签，CI 和 Release 就各把整棵 Tauri 依赖树编译一遍。
  push:
    branches: ["**"]
  pull_request:
  # Apple 会拦截 GitHub 托管 runner 的机房出口，即使 HTTP/2 与 Cookie 都正确也会
  # 返回 HTTP 541。把这种环境限制设为每日任务只会持续误报，不能代表桌面应用实际
  # 使用的 Chromium 会话已失效，因此这里只保留人工诊断入口。
  workflow_dispatch:

# 这条流水线不发布任何东西，也不写回仓库，只读足够。
permissions:
  contents: read

concurrency:
  # event_name 放进 group：手动契约测试和 push/PR 的检查各成一组，
  # 免得人工诊断把正在跑的检查挤掉，或者反过来。
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # package.json 里没有 packageManager 字段，pnpm/action-setup 无从推断版本，
  # 必须显式给出。哪天在 package.json 补上了 packageManager，就要把这里的
  # version 输入删掉 —— 两处都写且不一致时，该 action 会直接报错退出。
  PNPM_VERSION: "9"
  # lts/* 让 setup-node 解析到当前的 Node LTS。想要完全可复现就钉成具体大版本
  # （例如 "24"）；本项目对 Node 版本不敏感，vite 7 只要求 Node >= 20。
  NODE_VERSION: "lts/*"

jobs:
  # ---------------------------------------------------------------------------
  # 日常检查（只在 macOS 上跑）。
  #
  # 本修改版只发布 macOS 通用 DMG，不支持 Windows 和 Linux，所以只保留这一个
  # 必须绿的 job。检查范围也收窄到「能编译、测试能过」：前端测试、TypeScript
  # 类型检查、前端构建和 cargo test。cargo fmt / clippy -D warnings 不再作为
  # 门槛，需要时在本机自行运行。
  #
  # 只在 PR 和默认分支的 push 上跑，避免同一个提交在功能分支 push 与 PR 上
  # 各跑一遍 macOS（macOS runner 排队慢、冷缓存要编十来分钟）。
  # ---------------------------------------------------------------------------
  check-macos:
    name: 检查（macOS）
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # macOS 不需要装系统依赖：WebView 用系统自带的 WKWebView，音频用 CoreAudio，
      # 都在 SDK 里，Xcode Command Line Tools 是 runner 预装的。
      - uses: dtolnay/rust-toolchain@stable

      # 缓存要放在装好工具链之后：缓存 key 里含 rustc 版本，顺序反了会拿到错的 key。
      - uses: Swatinem/rust-cache@v2

      # pnpm 必须在 setup-node 之前装好：setup-node 的 cache: pnpm 会去调用
      # pnpm 来定位它的 store 目录，顺序反了会报 "Unable to locate executable file: pnpm"。
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 前端测试
        run: pnpm test

      - name: TypeScript 类型检查
        run: pnpm exec tsc --noEmit

      - name: 构建前端
        run: pnpm exec vite build

      # 这里**不能**加 --all-features：那会打开 live feature，真的去请求 Apple。
      # 真实接口的契约测试只在下面手动触发的 live job 里跑。
      - name: cargo test
        run: cargo test

  # ---------------------------------------------------------------------------
  # 针对 Apple 美国站真实接口的手动诊断测试（只在 macOS 上跑）。
  #
  # 上游就是因为 Apple 悄悄换了接口而彻底失效；单元测试拿假响应验证解析逻辑，
  # 拦不住这种事，只有真的打一次 Apple 才行。用例全部使用美国站（en_US），
  # 覆盖 iPhone 与 Apple HomeView。
  #
  # GitHub 托管 runner 收到 541 只能说明其机房出口被 Apple 拦截，不能作为桌面
  # 应用故障告警；需要诊断时手动触发，并结合本机 Chromium 真实链路测试判断。
  # ---------------------------------------------------------------------------
  live:
    name: Apple 美国站接口契约测试（手动）
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # 每次请求之间至少间隔 2 秒，正常几十秒就跑完。设上限防止对端挂起占着 runner。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --test live 只跑 crates/apw-core/tests/live.rs；该文件挂了
      # #![cfg(feature = "live")]，不开 feature 时编译成空，日常 cargo test 不会碰 Apple。
      # --nocapture 让接口响应片段直接出现在日志里，接口变了能看到 Apple 实际返回了什么。
      - name: 对 Apple 美国站线上接口跑契约测试
        run: cargo test -p apw-core --features live --test live -- --nocapture
